name: Stress tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq coreutils util-linux
      - uses: ./.github/actions/setup-bats
      - name: Run scheduler stress tests
        run: tests/run stress
