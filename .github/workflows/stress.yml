name: Stress tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq coreutils util-linux
      - uses: ./.github/actions/setup-bats
      - name: Run scheduler stress tests
        run: tests/run stress
