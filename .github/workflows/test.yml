name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install static-analysis dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - name: Run static checks
        run: tests/run static

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq coreutils util-linux perl
      - uses: ./.github/actions/setup-bats
      - name: Run offline suite
        run: tests/run

  bash-4-4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-bats
      - name: Run offline suite with Bash 4.4
        run: |
          docker run --rm -v "$PWD:/work" -v "$BATS_ROOT:/opt/bats:ro" \
            -w /work bash:4.4 -c '
              apk add --no-cache curl jq coreutils util-linux perl shellcheck ripgrep
              BATS=/opt/bats/bin/bats SYSTEM_BASH=/usr/local/bin/bash tests/run static
              BATS=/opt/bats/bin/bats tests/run
            '

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install runtime and test dependencies
        run: brew install bash coreutils gnu-getopt jq
      - uses: ./.github/actions/setup-bats
      - name: Run offline suite
        env:
          SYSTEM_BASH: /opt/homebrew/bin/bash
          GETOPT: /opt/homebrew/opt/gnu-getopt/bin/getopt
          REALPATH: /opt/homebrew/bin/grealpath
        run: tests/run
